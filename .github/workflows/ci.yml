name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run check
      - run: npm test
      - run: npm run build
